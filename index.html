<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15101c">
<title>Jayce Katsui | Links</title>
<meta name="description" content="Official links for Jayce Katsui — virtual creator.">
<style>
:root{
  --bg:#140f1a; --text:#fff9fc; --muted:#d5c6d5;
  --border:rgba(255,255,255,.17); --pink:#f1b8cf; --purple:#c4a2ff;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}
body{
  min-height:100vh;color:var(--text);background:var(--bg);
  display:flex;justify-content:center;padding:24px 14px 34px;position:relative;overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:-10%;z-index:-2;
  background:linear-gradient(rgba(10,7,15,.4),rgba(10,7,15,.82)),url("jayce-profile.png") center 30%/cover no-repeat;
  filter:blur(26px) saturate(.85);transform:scale(1.12);
}
body:after{
  content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(circle at 15% 10%,rgba(241,184,207,.24),transparent 34%),
             radial-gradient(circle at 88% 22%,rgba(196,162,255,.2),transparent 30%);
}
.wrap{width:min(100%,430px)}
.card{
  border:1px solid var(--border);border-radius:30px;overflow:hidden;
  background:linear-gradient(180deg,rgba(33,25,42,.74),rgba(20,15,27,.82));
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  box-shadow:0 24px 70px rgba(0,0,0,.45);
}
.hero{
  height:300px;position:relative;
  background:linear-gradient(to bottom,transparent 48%,rgba(20,15,27,.96)),url("jayce-profile.png") center 25%/cover no-repeat;
}
.badge{
  position:absolute;top:14px;right:14px;padding:7px 10px;border-radius:999px;
  background:rgba(10,8,14,.55);border:1px solid rgba(255,255,255,.18);
  font-size:12px;backdrop-filter:blur(10px)
}
.content{padding:0 18px 20px;margin-top:-38px;position:relative}
.avatar{
  width:82px;height:82px;border-radius:50%;object-fit:cover;object-position:center 22%;
  border:3px solid rgba(255,255,255,.92);box-shadow:0 10px 28px rgba(0,0,0,.35)
}
h1{margin:10px 0 3px;font-size:30px;line-height:1.05;letter-spacing:-.03em}
.handle{font-size:14px;color:#eaddea;margin-bottom:8px}
.bio{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.45}
.links{display:grid;gap:11px}
.link{
  display:flex;align-items:center;justify-content:space-between;text-decoration:none;color:var(--text);
  padding:15px 16px;border-radius:18px;border:1px solid var(--border);
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.055));
  transition:.18s ease;-webkit-tap-highlight-color:transparent
}
.link:active{transform:scale(.985)}
@media(hover:hover){.link:hover{transform:translateY(-2px);background:rgba(255,255,255,.13)}}
.featured{background:linear-gradient(135deg,rgba(241,184,207,.22),rgba(196,162,255,.22))}
.left{display:flex;align-items:center;gap:12px}
.icon{
  width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
  background:rgba(255,255,255,.10);font-size:18px
}
.label strong{display:block;font-size:15px}
.label span{display:block;font-size:12px;color:#cabdca;margin-top:2px}
.arrow{font-size:20px;color:#d8cbd8}
.footer{text-align:center;color:#b9abb9;font-size:11px;line-height:1.45;padding:17px 8px 2px}
.footer b{color:#ebdeea}
</style>
</head>
<body>
<main class="wrap">
<section class="card">
  <div class="hero"><div class="badge">✦ virtual creator</div></div>
  <div class="content">
    <img class="avatar" src="jayce-profile.png" alt="Jayce Katsui profile image">
    <h1>Jayce Katsui</h1>
    <div class="handle">@jaycekatsui</div>
    <p class="bio">gaming • lifestyle • exclusive content ♡<br>all my official links in one place</p>

    <div class="links">
      <a class="link featured" href="https://www.fanvue.com/jaycekatsuix" target="_blank" rel="noopener noreferrer">
        <div class="left"><div class="icon">♡</div><div class="label"><strong>Fanvue</strong><span>exclusive content</span></div></div><div class="arrow">›</div>
      </a>
      <a class="link" href="https://cash.app/$JayceKatsui" target="_blank" rel="noopener noreferrer">
        <div class="left"><div class="icon">$</div><div class="label"><strong>Cash App</strong><span>$JayceKatsui</span></div></div><div class="arrow">›</div>
      </a>
      <a class="link" href="https://instagram.com/jaycekatsui" target="_blank" rel="noopener noreferrer">
        <div class="left"><div class="icon">◎</div><div class="label"><strong>Instagram</strong><span>@jaycekatsui</span></div></div><div class="arrow">›</div>
      </a>
      <a class="link" href="https://x.com/JayceKatxsui" target="_blank" rel="noopener noreferrer">
        <div class="left"><div class="icon">𝕏</div><div class="label"><strong>X / Twitter</strong><span>@JayceKatxsui</span></div></div><div class="arrow">›</div>
      </a>
    </div>

    <div class="footer"><b>Jayce Katsui is a virtual / AI creator.</b><br>Official links only.</div>
  </div>
</section>
</main>
</body>
</html>
